# Refresh adjusted closes and mutual-fund redemption prices from the TASE site.
# The browser cannot call these endpoints (the exchange firewall requires the
# TASE site as Origin). This snapshot is the whole public market, not a portfolio.
name: Refresh TASE prices

on:
  schedule:
    # Sun–Thu 16:30 UTC, after the Tel Aviv close (about 18:30 Israel standard time,
    # 19:30 when Israel is on daylight time).
    - cron: "30 16 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch TASE closes and redemption prices
        run: python3 scripts/fetch_tase_prices.py
      - name: Commit snapshot when it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/tase-prices.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "v2: refresh TASE price snapshot"
            git push
          fi
